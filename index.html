<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avocado Shop Pro - Insumos Profesionales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-20">

    <!-- BARRA NAVEGACIÓN PRINCIPAL -->
    <header class="bg-white border-b sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showSection('shop')">
                <div class="flex flex-col">
                    <span class="font-extrabold text-xl text-emerald-700 tracking-tight leading-none">Avocado Shop 🥑</span>
                    <span class="text-[10px] text-slate-500 font-semibold mt-0.5">Insumos de uñas, cejas y pestañas</span>
                </div>
            </div>

            <div class="hidden md:flex flex-1 max-w-md mx-4">
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Buscar geles, lámparas, brochas..." 
                    class="w-full text-xs bg-slate-100 border border-transparent focus:border-emerald-500 focus:bg-white rounded-full px-4 py-2 outline-none transition">
            </div>

            <div class="flex items-center gap-3">
                <div class="bg-slate-800 text-emerald-400 text-[11px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1 shadow-inner">
                    <span>BCV:</span>
                    <span id="bcvRateBadge">Bs. 832.49</span>
                </div>

                <button onclick="showSection('shop')" class="text-xs font-bold text-slate-700 hover:text-emerald-600 px-2 py-1">Tienda</button>
                <button onclick="showSection('tracking')" class="text-xs font-bold text-slate-700 hover:text-emerald-600 px-2 py-1">Rastreo</button>
                <button onclick="displayAppointmentsScreen()" class="text-xs font-bold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-lg border border-indigo-200 transition">🖥️ Citas</button>
                <button onclick="toggleCartDrawer()" class="relative bg-slate-100 hover:bg-slate-200 p-2 rounded-full transition">
                    🛒 <span id="cartCount" class="absolute -top-1 -right-1 bg-emerald-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- BANNER TASA BCV -->
    <div class="bg-emerald-50 border-b border-emerald-100 py-2 px-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between text-xs font-bold text-emerald-900">
            <span>🏛️ Tasa Oficial BCV: <strong id="bcvRateBanner">Bs. 832.49</strong></span>
            <button onclick="openBcvModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-md text-[11px] transition">Modificar</button>
        </div>
    </div>

    <!-- SECCIÓN TIENDA / CATÁLOGO -->
    <section id="shopSection" class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-4 scrollbar-none">
            <button onclick="filterCategory('ALL')" class="category-btn active bg-emerald-600 text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap">Todos</button>
            <button onclick="filterCategory('Preparadores y Bases')" class="category-btn bg-white border border-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap">Preparadores y Bases</button>
            <button onclick="filterCategory('Esmaltes Semi')" class="category-btn bg-white border border-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap">Esmaltes Semi</button>
            <button onclick="filterCategory('Sistemas Constructores')" class="category-btn bg-white border border-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap">Sistemas Constructores</button>
        </div>

        <div class="bg-emerald-50/60 border border-emerald-100 p-3 rounded-xl mb-6 flex items-center justify-between max-w-sm">
            <label class="text-xs font-bold text-emerald-900">📍 Sucursal:</label>
            <select id="branchFilterSelect" onchange="filterProducts()" class="bg-white border text-slate-800 font-bold text-xs rounded-lg px-3 py-1.5 outline-none cursor-pointer">
                <option value="ALL">Todas las Sucursales</option>
                <option value="San Félix">San Félix</option>
                <option value="CC Alta Vista I">CC Alta Vista I</option>
                <option value="CC Alta Vista II">CC Alta Vista II</option>
            </select>
        </div>

        <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Productos cargados dinámicamente -->
        </div>
    </section>

    <!-- MÓDULO FORMULARIO DE CITAS -->
    <section id="appointmentSection" class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl shadow-sm border p-6 md:p-8">
            <div class="text-center mb-6">
                <span class="text-[11px] font-bold tracking-widest text-emerald-600 uppercase bg-emerald-50 px-3 py-1 rounded-full">AVOCADO SPA & NAILS</span>
                <h2 class="text-2xl font-extrabold text-slate-800 mt-2">Reserva tu Cita de Manicura</h2>
            </div>

            <form id="appointmentForm" onsubmit="handleCreateAppointment(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre Completo *</label>
                        <input type="text" id="appClientName" required placeholder="Ej. María Delgado" class="w-full text-xs border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono *</label>
                        <input type="tel" id="appClientPhone" required placeholder="04141234567" class="w-full text-xs border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Sucursal *</label>
                        <select id="appBranchSelect" class="w-full text-xs border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="San Félix">San Félix</option>
                            <option value="CC Alta Vista I">CC Alta Vista I</option>
                            <option value="CC Alta Vista II">CC Alta Vista II</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Servicio *</label>
                        <select id="appServiceSelect" class="w-full text-xs border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="srv-1">Manicura Rusa + Gelificación ($25.00)</option>
                            <option value="srv-2">Sistema de Uñas Polygel ($35.00)</option>
                            <option value="srv-3">Pedicura Spa + Semipermanente ($20.00)</option>
                            <option value="srv-4">Mantenimiento / Retiro ($15.00)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Especialista</label>
                        <select id="appStaffSelect" class="w-full text-xs border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="stf-1">Valeria Gómez (Nail Art & Polygel)</option>
                            <option value="stf-2">Camila Rivas (Manicura Rusa)</option>
                            <option value="stf-3">Daniela Torres (Pedicura Spa & Gel)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha *</label>
                        <input type="date" id="appDate" required class="w-full text-xs border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Hora *</label>
                        <select id="appTimeSelect" class="w-full text-xs border rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-xs shadow-md">
                    🗓️ Reservar Cita vía WhatsApp
                </button>
            </form>
        </div>
    </section>

    <!-- DRAWER LATERAL: CARRITO DE COMPRAS Y CHECKOUT -->
    <div id="cartDrawer" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-6 overflow-y-auto">
            <div>
                <div class="flex items-center justify-between pb-4 border-b">
                    <h2 class="text-lg font-bold text-slate-800">🛒 Tu Carrito de Compras</h2>
                    <button onclick="toggleCartDrawer()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
                </div>
                <div id="cartItems" class="space-y-3 my-4"></div>
            </div>

            <div class="border-t pt-4">
                <form id="checkoutForm" onsubmit="handleCheckout(event)" class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Nombre Completo *</label>
                        <input type="text" id="cName" required class="w-full border rounded-lg p-2 text-xs outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">C.I / RIF *</label>
                            <input type="text" id="cDoc" required placeholder="V-12345678" class="w-full border rounded-lg p-2 text-xs outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-600 mb-1">Teléfono *</label>
                            <input type="tel" id="cPhone" required placeholder="04141234567" class="w-full border rounded-lg p-2 text-xs outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Método de Entrega *</label>
                        <select id="cDelivery" onchange="toggleDeliveryFields()" class="w-full border rounded-lg p-2 text-xs outline-none font-medium">
                            <option value="pickup">Retiro en Tienda (Gratis)</option>
                            <option value="delivery">Delivery ($3.00 Adicional)</option>
                        </select>
                    </div>
                    <div id="branchSelectContainer">
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Seleccionar Sucursal *</label>
                        <select id="cBranch" class="w-full border rounded-lg p-2 text-xs outline-none font-medium">
                            <option value="San Félix">San Félix</option>
                            <option value="CC Alta Vista I">CC Alta Vista I</option>
                            <option value="CC Alta Vista II">CC Alta Vista II</option>
                        </select>
                    </div>
                    <div id="addressContainer" class="hidden">
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Dirección de Envío Exacta *</label>
                        <textarea id="cAddress" rows="2" class="w-full border rounded-lg p-2 text-xs outline-none" placeholder="Indica sector, calle, punto de referencia..."></textarea>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 mb-1">Número de Referencia (Pago Móvil) *</label>
                        <input type="text" id="cRef" required placeholder="Ej: 984012" class="w-full border rounded-lg p-2 text-xs outline-none">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-xs shadow-md">
                        🚀 Confirmar Pedido y Enviar WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL CITAS PANTALLA COMPLETA -->
    <div id="appointmentsScreenModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-5xl rounded-2xl shadow-2xl border flex flex-col max-h-[90vh]">
            <div class="p-4 border-b flex items-center justify-between bg-slate-50 rounded-t-2xl">
                <h3 class="font-extrabold text-slate-900 text-base">🖥️ Pantalla General de Citas</h3>
                <button onclick="closeAppointmentsScreen()" class="text-slate-400 hover:text-slate-700 text-xl font-bold p-1">✕</button>
            </div>
            <div class="p-4 border-b bg-white flex flex-wrap gap-3 items-center justify-between">
                <input type="text" id="appScreenSearch" oninput="renderAppointmentsScreen()" placeholder="🔍 Buscar por cliente o código..." class="text-xs p-2.5 border rounded-lg w-full md:w-64 outline-none">
                <select id="appScreenBranchFilter" onchange="renderAppointmentsScreen()" class="text-xs p-2.5 border rounded-lg bg-slate-50 font-bold outline-none">
                    <option value="ALL">Todas las sucursales</option>
                    <option value="San Félix">San Félix</option>
                    <option value="CC Alta Vista I">CC Alta Vista I</option>
                    <option value="CC Alta Vista II">CC Alta Vista II</option>
                </select>
            </div>
            <div class="p-4 overflow-y-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-[11px] font-bold text-slate-600 uppercase border-b">
                            <th class="p-3">Código</th>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Servicio</th>
                            <th class="p-3">Sucursal / Especialista</th>
                            <th class="p-3">Fecha / Hora</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsScreenTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="appointments.js"></script>
    <script>
        function toggleCartDrawer() {
            document.getElementById('cartDrawer').classList.toggle('hidden');
        }
        function toggleDeliveryFields() {
            const isDelivery = document.getElementById('cDelivery').value === 'delivery';
            document.getElementById('addressContainer').classList.toggle('hidden', !isDelivery);
            document.getElementById('branchSelectContainer').classList.toggle('hidden', isDelivery);
        }
        function showSection(sec) {
            document.getElementById('shopSection').classList.toggle('hidden', sec !== 'shop');
        }
    </script>
</body>
</html>
